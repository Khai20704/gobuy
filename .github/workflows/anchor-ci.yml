name: Anchor program CI

# Compiles and unit-tests the Na Vault Anchor program on a Linux runner.
#
# This workflow never deploys, never upgrades, never signs a transaction and never needs a wallet
# keypair, a private key, an RPC secret or any repository secret. It only produces build logs and
# the SBF artifact so a real CPI can be tested later against a controlled validator.
#
# Toolchain pinning:
#   * anchor-lang 1.2.0 declares `rust-version = 1.89`, so the host toolchain is pinned to 1.89.0.
#   * The Anchor 1.2.0 CLI depends on solana-cli-config/solana-client ^3.0.14, so the Agave
#     (Solana) CLI is pinned to v3.0.14. `cargo test` runs on the host; `cargo build-sbf` needs
#     a separately pinned platform-tools v1.52 (Rust 1.89, edition-2024-capable Cargo).
#     Agave's default v1.51 uses Rust 1.84.1 / Cargo 1.84.0, regardless of the host pin.
# Do not replace these with floating versions: the SBF std and the program's dependency graph are
# version-sensitive.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anchor/**'
      - '.github/workflows/anchor-ci.yml'
      - 'scripts/verify-tensor-constants.mjs'
      - 'scripts/verify-sbf-program-id.mjs'
  pull_request:
    paths:
      - 'anchor/**'
      - '.github/workflows/anchor-ci.yml'
      - 'scripts/verify-tensor-constants.mjs'
      - 'scripts/verify-sbf-program-id.mjs'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.89.0'
  AGAVE_VERSION: 'v3.0.14'
  SBF_TOOLS_VERSION: 'v1.52'
  # Existing Devnet program identity. Read-only here; nothing in this workflow can change it.
  PROGRAM_ID: 'CHjdqooB7TrussJoZoboFP5TtdCspoHtvPpqoshbr5zE'

jobs:
  anchor-program:
    name: Compile and test the Anchor program (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Install the Agave (Solana) CLI ${{ env.AGAVE_VERSION }}
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Show the pinned toolchain versions
        run: |
          set -euo pipefail
          mkdir -p build-logs
          {
            rustc --version
            cargo --version
            solana --version
            # This reports the builder's DEFAULT tools, not the override below.
            cargo build-sbf --version
            echo "Selected SBF platform-tools: $SBF_TOOLS_VERSION"
            cargo build-sbf --install-only --tools-version "$SBF_TOOLS_VERSION"
            sbf_bin="$HOME/.cache/solana/$SBF_TOOLS_VERSION/platform-tools/rust/bin"
            # Fail here if the installer fell back to its older default version.
            echo "SBF Cargo executable: $(readlink -f "$sbf_bin/cargo")"
            "$sbf_bin/rustc" --version
            "$sbf_bin/cargo" --version
          } 2>&1 | tee build-logs/toolchain-versions.log

      - name: Check the mirrored Tensor constants (Rust, shared client, official SDK)
        run: node scripts/verify-tensor-constants.mjs

      - name: Compile the program to SBF bytecode
        run: |
          set -euo pipefail
          mkdir -p build-logs
          # build-sbf runs host metadata before forwarding --locked to SBF Cargo.
          cargo metadata --manifest-path anchor/programs/gobuy_na/Cargo.toml --locked --format-version 1 > /dev/null
          cargo build-sbf \
            --tools-version "$SBF_TOOLS_VERSION" \
            --verbose \
            --manifest-path anchor/programs/gobuy_na/Cargo.toml \
            --sbf-out-dir anchor/target/deploy -- --locked 2>&1 | tee build-logs/cargo-build-sbf.log

      - name: Record installed SBF executables and check the lockfile
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-logs
          {
            sbf_bin="$HOME/.cache/solana/$SBF_TOOLS_VERSION/platform-tools/rust/bin"
            # Inspect the pinned binaries directly; do not infer a rustup registration name.
            echo "SBF platform-tools: $SBF_TOOLS_VERSION"
            test -x "$sbf_bin/rustc"
            test -x "$sbf_bin/cargo"
            actual_rustc=$(readlink -f "$sbf_bin/rustc")
            actual_cargo=$(readlink -f "$sbf_bin/cargo")
            echo "Installed SBF Rust executable: $actual_rustc"
            echo "Installed SBF Cargo executable: $actual_cargo"
            "$actual_rustc" --version
            "$actual_cargo" --version
          } 2>&1 | tee build-logs/sbf-cargo-selection.log
          git diff --exit-code -- anchor/Cargo.lock

      - name: Verify the compiled artifact still carries the existing program id
        run: node scripts/verify-sbf-program-id.mjs anchor/target/deploy/gobuy_na.so "$PROGRAM_ID"

      - name: Record artifact hashes
        run: |
          set -euo pipefail
          ls -l anchor/target/deploy
          sha256sum anchor/target/deploy/*.so | tee build-logs/sha256.txt

      # The SBF build runs before the host tests deliberately: the compiled artifact is the primary
      # deliverable, so a failing host test still leaves a .so and its logs to inspect.
      - name: Run the program unit tests on the host
        run: |
          set -o pipefail
          mkdir -p build-logs
          cargo test --manifest-path anchor/Cargo.toml --all-targets --locked 2>&1 | tee build-logs/cargo-test.log

      - name: Upload build logs and the SBF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-program-sbf
          path: |
            build-logs/**
            anchor/target/deploy/*.so
          if-no-files-found: warn
          retention-days: 30
